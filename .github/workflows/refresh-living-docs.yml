name: Refresh living docs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-living-docs.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh living documents
        run: python scripts/update_living_docs.py

      - name: Commit refreshed documents
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain PROJECT_STATUS.md)" ]; then
            echo "Living documents are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md \
            AWS_DEPLOYMENT_GUIDE.md \
            AWS_IOT_RESOURCE_PLAN.md \
            AWS_RESOURCE_INVENTORY.md \
            AWS_ROLLBACK_GUIDE.md \
            DYNAMODB_ZONE_TABLE_DESIGN.md \
            IOT_DEVICE_REGISTRY.md \
            IOT_PHASE_2_IMPLEMENTATION_SEQUENCE.md \
            MQTT_TOPIC_CONTRACT.md \
            POD_LAYOUT_MEASUREMENT_REPORT.md \
            SENSOR_TO_EXPERIENCE_TRIGGER_MAP.md \
            WEBSOCKET_ZONE_PUSH_PLAN.md \
            ZONE_EVENT_SCHEMA.md
          git commit -m "Refresh living project documentation"
          git push origin main
