AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MySnoozePod IoT backend stack for zone event ingestion, persistence, quarantine, and observability.

Parameters:
  DeploymentEnv:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment isolated across IoT, Lambda, DynamoDB, SQS, and CloudWatch.
  StoreId:
    Type: String
    Default: severn-pilot
    Description: MySnoozePod showroom store identifier.
  EventTtlDays:
    Type: Number
    Default: 180
    MinValue: 1
    Description: TTL in days for append-only zone event history and idempotency records.
  LogLevel:
    Type: String
    Default: info
    AllowedValues:
      - debug
      - info
      - warn
      - error
    Description: Runtime log level for IoT ingestion.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
    Description: CloudWatch log retention for the ingestion Lambda.
  WebSocketConnectionTtlSeconds:
    Type: Number
    Default: 86400
    MinValue: 300
    Description: TTL in seconds for WebSocket connection and subscription records.
  PhysicalCommandTtlDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: TTL in days for physical control command status and latest reported physical state.
  PhysicalCommandTimeoutMs:
    Type: Number
    Default: 15000
    MinValue: 1000
    Description: Milliseconds before a physical control command is eligible for timeout handling.
  IotDataEndpoint:
    Type: String
    Default: ""
    Description: AWS IoT Data-ATS endpoint hostname used for publishing physical commands. Example abc123-ats.iot.us-east-1.amazonaws.com.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email endpoint for IoT alarm notifications. Leave blank to create alarms without email actions.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Timeout: 15
    MemorySize: 256

Resources:
  ZoneStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "msp-${DeploymentEnv}-zone-state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  ZoneEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "msp-${DeploymentEnv}-zone-events"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  WebSocketConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "msp-${DeploymentEnv}-websocket-connections"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  PhysicalControlTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "msp-${DeploymentEnv}-physical-control"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  IoTQuarantineQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "msp-${DeploymentEnv}-iot-quarantine"
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  IoTAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "msp-${DeploymentEnv}-iot-alarms"
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  IoTAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref IoTAlarmTopic

  ShowroomWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "msp-${DeploymentEnv}-iot-websocket"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"
      Tags:
        App: MySnoozePod
        Environment: !Ref DeploymentEnv
        StackArea: IoT

  ShowroomWebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ShowroomWebSocketApi
      StageName: !Ref DeploymentEnv
      AutoDeploy: true
      Tags:
        App: MySnoozePod
        Environment: !Ref DeploymentEnv
        StackArea: IoT

  ZoneEventIngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/msp-${DeploymentEnv}-zone-event-ingest"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  IotWebSocketLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/msp-${DeploymentEnv}-iot-websocket"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  IotWebSocketCleanupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/msp-${DeploymentEnv}-iot-websocket-cleanup"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  PhysicalControlAckLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/msp-${DeploymentEnv}-physical-control-ack"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  PhysicalControlReportedStateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/msp-${DeploymentEnv}-physical-control-reported-state"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  PhysicalControlTimeoutLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/msp-${DeploymentEnv}-physical-control-timeout"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  IotWebSocketFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - IotWebSocketLogGroup
    Properties:
      FunctionName: !Sub "msp-${DeploymentEnv}-iot-websocket"
      Description: MySnoozePod IoT WebSocket connection and subscription handler.
      CodeUri: .
      Handler: index.iotWebSocketHandler
      Environment:
        Variables:
          IOT_ENV: !Ref DeploymentEnv
          IOT_STORE_ID: !Ref StoreId
          IOT_DEVICE_REGISTRY_PATH: data/iot-device-registry.v1.json
          SHOWROOM_DEVICE_REGISTRY_PATH: data/showroom-device-registry.v1.json
          WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_CONNECTION_TTL_SECONDS: !Ref WebSocketConnectionTtlSeconds
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Sid: WebSocketConnectionReadWrite
              Effect: Allow
              Action:
                - dynamodb:BatchWriteItem
                - dynamodb:DeleteItem
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt WebSocketConnectionsTable.Arn
                - !Sub "${WebSocketConnectionsTable.Arn}/index/*"
      Tags:
        App: MySnoozePod
        Environment: !Ref DeploymentEnv
        StackArea: IoT

  IotWebSocketCleanupFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - IotWebSocketCleanupLogGroup
    Properties:
      FunctionName: !Sub "msp-${DeploymentEnv}-iot-websocket-cleanup"
      Description: MySnoozePod IoT WebSocket stale connection cleanup handler.
      CodeUri: .
      Handler: index.iotWebSocketCleanupHandler
      Environment:
        Variables:
          WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Sid: WebSocketConnectionCleanup
              Effect: Allow
              Action:
                - dynamodb:BatchWriteItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
              Resource:
                - !GetAtt WebSocketConnectionsTable.Arn
      Events:
        CleanupSchedule:
          Type: Schedule
          Properties:
            Name: !Sub "msp-${DeploymentEnv}-iot-websocket-cleanup"
            Schedule: rate(15 minutes)
            Enabled: true
      Tags:
        App: MySnoozePod
        Environment: !Ref DeploymentEnv
        StackArea: IoT

  WebSocketLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ShowroomWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - FunctionArn: !GetAtt IotWebSocketFunction.Arn

  WebSocketConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ShowroomWebSocketApi
      RouteKey: "$connect"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketLambdaIntegration}"

  WebSocketDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ShowroomWebSocketApi
      RouteKey: "$disconnect"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketLambdaIntegration}"

  WebSocketSubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ShowroomWebSocketApi
      RouteKey: "subscribe"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketLambdaIntegration}"

  WebSocketUnsubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ShowroomWebSocketApi
      RouteKey: "unsubscribe"
      AuthorizationType: NONE
      Target: !Sub "integrations/${WebSocketLambdaIntegration}"

  WebSocketInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IotWebSocketFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ShowroomWebSocketApi}/*"

  PhysicalControlCommandFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "msp-${DeploymentEnv}-physical-control-command"
      Description: MySnoozePod physical control command validation, persistence, and IoT publish handler.
      CodeUri: .
      Handler: index.iotPhysicalControlCommandHandler
      Environment:
        Variables:
          IOT_ENV: !Ref DeploymentEnv
          IOT_STORE_ID: !Ref StoreId
          IOT_DEVICE_REGISTRY_PATH: data/iot-device-registry.v1.json
          IOT_PHYSICAL_CONTROL_TABLE: !Ref PhysicalControlTable
          IOT_PHYSICAL_COMMAND_TTL_DAYS: !Ref PhysicalCommandTtlDays
          IOT_PHYSICAL_COMMAND_TIMEOUT_MS: !Ref PhysicalCommandTimeoutMs
          IOT_DATA_ENDPOINT: !Ref IotDataEndpoint
          WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_API_ENDPOINT: !Sub "https://${ShowroomWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${DeploymentEnv}"
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Sid: PhysicalControlReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt PhysicalControlTable.Arn
                - !Sub "${PhysicalControlTable.Arn}/index/*"
            - Sid: PublishPhysicalControlCommands
              Effect: Allow
              Action:
                - iot:Publish
              Resource:
                - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/mysnoozepod/${DeploymentEnv}/stores/${StoreId}/devices/*/commands"
            - Sid: QueryAndCleanWebSocketSubscribers
              Effect: Allow
              Action:
                - dynamodb:BatchWriteItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt WebSocketConnectionsTable.Arn
                - !Sub "${WebSocketConnectionsTable.Arn}/index/*"
            - Sid: BroadcastToWebSocketConnections
              Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource:
                - !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ShowroomWebSocketApi}/${DeploymentEnv}/POST/@connections/*"
      Tags:
        App: MySnoozePod
        Environment: !Ref DeploymentEnv
        StackArea: IoT

  PhysicalControlAckFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - PhysicalControlAckLogGroup
    Properties:
      FunctionName: !Sub "msp-${DeploymentEnv}-physical-control-ack"
      Description: MySnoozePod physical controller ack ingestion handler.
      CodeUri: .
      Handler: index.iotPhysicalControlAckHandler
      Environment:
        Variables:
          IOT_ENV: !Ref DeploymentEnv
          IOT_STORE_ID: !Ref StoreId
          IOT_PHYSICAL_CONTROL_TABLE: !Ref PhysicalControlTable
          WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_API_ENDPOINT: !Sub "https://${ShowroomWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${DeploymentEnv}"
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Sid: PhysicalControlAckReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt PhysicalControlTable.Arn
            - Sid: QueryAndCleanWebSocketSubscribers
              Effect: Allow
              Action:
                - dynamodb:BatchWriteItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt WebSocketConnectionsTable.Arn
                - !Sub "${WebSocketConnectionsTable.Arn}/index/*"
            - Sid: BroadcastToWebSocketConnections
              Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource:
                - !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ShowroomWebSocketApi}/${DeploymentEnv}/POST/@connections/*"
      Tags:
        App: MySnoozePod
        Environment: !Ref DeploymentEnv
        StackArea: IoT

  PhysicalControlReportedStateFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - PhysicalControlReportedStateLogGroup
    Properties:
      FunctionName: !Sub "msp-${DeploymentEnv}-physical-control-reported-state"
      Description: MySnoozePod physical controller reported-state ingestion handler.
      CodeUri: .
      Handler: index.iotPhysicalControlReportedStateHandler
      Environment:
        Variables:
          IOT_ENV: !Ref DeploymentEnv
          IOT_STORE_ID: !Ref StoreId
          IOT_PHYSICAL_CONTROL_TABLE: !Ref PhysicalControlTable
          WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_API_ENDPOINT: !Sub "https://${ShowroomWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${DeploymentEnv}"
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Sid: PhysicalControlReportedStateWrite
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt PhysicalControlTable.Arn
            - Sid: QueryAndCleanWebSocketSubscribers
              Effect: Allow
              Action:
                - dynamodb:BatchWriteItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt WebSocketConnectionsTable.Arn
                - !Sub "${WebSocketConnectionsTable.Arn}/index/*"
            - Sid: BroadcastToWebSocketConnections
              Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource:
                - !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ShowroomWebSocketApi}/${DeploymentEnv}/POST/@connections/*"
      Tags:
        App: MySnoozePod
        Environment: !Ref DeploymentEnv
        StackArea: IoT

  PhysicalControlTimeoutFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - PhysicalControlTimeoutLogGroup
    Properties:
      FunctionName: !Sub "msp-${DeploymentEnv}-physical-control-timeout"
      Description: MySnoozePod physical command timeout sweep.
      CodeUri: .
      Handler: index.iotPhysicalControlTimeoutHandler
      Environment:
        Variables:
          IOT_ENV: !Ref DeploymentEnv
          IOT_STORE_ID: !Ref StoreId
          IOT_PHYSICAL_CONTROL_TABLE: !Ref PhysicalControlTable
          WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_API_ENDPOINT: !Sub "https://${ShowroomWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${DeploymentEnv}"
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Sid: PhysicalControlTimeoutReadWrite
              Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt PhysicalControlTable.Arn
            - Sid: QueryAndCleanWebSocketSubscribers
              Effect: Allow
              Action:
                - dynamodb:BatchWriteItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt WebSocketConnectionsTable.Arn
                - !Sub "${WebSocketConnectionsTable.Arn}/index/*"
            - Sid: BroadcastToWebSocketConnections
              Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource:
                - !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ShowroomWebSocketApi}/${DeploymentEnv}/POST/@connections/*"
      Events:
        TimeoutSchedule:
          Type: Schedule
          Properties:
            Name: !Sub "msp-${DeploymentEnv}-physical-control-timeout"
            Schedule: rate(1 minute)
            Enabled: true
      Tags:
        App: MySnoozePod
        Environment: !Ref DeploymentEnv
        StackArea: IoT

  ZoneEventIngestFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ZoneEventIngestLogGroup
    Properties:
      FunctionName: !Sub "msp-${DeploymentEnv}-zone-event-ingest"
      Description: MySnoozePod IoT ZoneEvent ingestion handler.
      CodeUri: .
      Handler: index.iotZoneEventHandler
      Environment:
        Variables:
          IOT_ENV: !Ref DeploymentEnv
          IOT_STORE_ID: !Ref StoreId
          IOT_DEVICE_REGISTRY_PATH: data/iot-device-registry.v1.json
          IOT_ZONE_STATE_TABLE: !Ref ZoneStateTable
          IOT_ZONE_EVENTS_TABLE: !Ref ZoneEventsTable
          IOT_QUARANTINE_QUEUE_URL: !Ref IoTQuarantineQueue
          IOT_EVENT_TTL_DAYS: !Ref EventTtlDays
          IOT_LOG_LEVEL: !Ref LogLevel
          WEBSOCKET_CONNECTIONS_TABLE: !Ref WebSocketConnectionsTable
          WEBSOCKET_API_ENDPOINT: !Sub "https://${ShowroomWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${DeploymentEnv}"
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Sid: ZoneStateReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt ZoneStateTable.Arn
            - Sid: ZoneEventAppendAndIdempotency
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:TransactWriteItems
                - dynamodb:Query
              Resource:
                - !GetAtt ZoneEventsTable.Arn
                - !Sub "${ZoneEventsTable.Arn}/index/*"
            - Sid: QuarantineMalformedEvents
              Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt IoTQuarantineQueue.Arn
            - Sid: QueryAndCleanWebSocketSubscribers
              Effect: Allow
              Action:
                - dynamodb:BatchWriteItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt WebSocketConnectionsTable.Arn
                - !Sub "${WebSocketConnectionsTable.Arn}/index/*"
            - Sid: BroadcastToWebSocketConnections
              Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource:
                - !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ShowroomWebSocketApi}/${DeploymentEnv}/POST/@connections/*"
      Tags:
        App: MySnoozePod
        Environment: !Ref DeploymentEnv
        StackArea: IoT

  ZoneEventIngestRule:
    Type: AWS::IoT::TopicRule
    DependsOn:
      - ZoneEventIngestInvokePermission
    Properties:
      RuleName: !Sub "msp_${DeploymentEnv}_zone_event_ingest_rule"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Sql: "SELECT *, topic() AS mqttTopic, timestamp() AS iotReceivedAt FROM 'mysnoozepod/+/stores/+/zones/+/events'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt ZoneEventIngestFunction.Arn
        ErrorAction:
          Sqs:
            QueueUrl: !Ref IoTQuarantineQueue
            RoleArn: !GetAtt IoTRuleErrorActionRole.Arn
            UseBase64: false

  IoTRuleErrorActionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "msp-${DeploymentEnv}-iot-rule-error-action-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendIoTRuleFailuresToQuarantine
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt IoTQuarantineQueue.Arn
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  ZoneEventIngestInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ZoneEventIngestFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/msp_${DeploymentEnv}_zone_event_ingest_rule"

  PhysicalControlAckRule:
    Type: AWS::IoT::TopicRule
    DependsOn:
      - PhysicalControlAckInvokePermission
    Properties:
      RuleName: !Sub "msp_${DeploymentEnv}_physical_control_ack_rule"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Sql: "SELECT *, topic() AS mqttTopic, timestamp() AS iotReceivedAt FROM 'mysnoozepod/+/stores/+/devices/+/ack'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt PhysicalControlAckFunction.Arn
        ErrorAction:
          Sqs:
            QueueUrl: !Ref IoTQuarantineQueue
            RoleArn: !GetAtt IoTRuleErrorActionRole.Arn
            UseBase64: false

  PhysicalControlReportedStateRule:
    Type: AWS::IoT::TopicRule
    DependsOn:
      - PhysicalControlReportedStateInvokePermission
    Properties:
      RuleName: !Sub "msp_${DeploymentEnv}_physical_control_reported_state_rule"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Sql: "SELECT *, topic() AS mqttTopic, timestamp() AS iotReceivedAt FROM 'mysnoozepod/+/stores/+/devices/+/reported-state'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt PhysicalControlReportedStateFunction.Arn
        ErrorAction:
          Sqs:
            QueueUrl: !Ref IoTQuarantineQueue
            RoleArn: !GetAtt IoTRuleErrorActionRole.Arn
            UseBase64: false

  PhysicalControlAckInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PhysicalControlAckFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/msp_${DeploymentEnv}_physical_control_ack_rule"

  PhysicalControlReportedStateInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PhysicalControlReportedStateFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/msp_${DeploymentEnv}_physical_control_reported_state_rule"

  ZoneEventAcceptedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ZoneEventIngestLogGroup
      FilterPattern: '{ $.event = "iot.zone_event.accepted" }'
      MetricTransformations:
        - MetricNamespace: MySnoozePod/IoT
          MetricName: ZoneEventAcceptedLog
          MetricValue: "1"

  ZoneEventRejectedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ZoneEventIngestLogGroup
      FilterPattern: '{ $.event = "iot.zone_event.rejected" }'
      MetricTransformations:
        - MetricNamespace: MySnoozePod/IoT
          MetricName: ZoneEventRejectedLog
          MetricValue: "1"

  ZoneEventDuplicateMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ZoneEventIngestLogGroup
      FilterPattern: '{ $.event = "iot.zone_event.duplicate_suppressed" }'
      MetricTransformations:
        - MetricNamespace: MySnoozePod/IoT
          MetricName: ZoneEventDuplicateSuppressedLog
          MetricValue: "1"

  QuarantineFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ZoneEventIngestLogGroup
      FilterPattern: '{ $.event = "iot.zone_event.quarantine_failed" }'
      MetricTransformations:
        - MetricNamespace: MySnoozePod/IoT
          MetricName: ZoneEventQuarantineFailedLog
          MetricValue: "1"

  PhysicalControlAckMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref PhysicalControlAckLogGroup
      FilterPattern: '{ $.PhysicalCommandAckReceived = 1 }'
      MetricTransformations:
        - MetricNamespace: MySnoozePod/IoT
          MetricName: PhysicalCommandAckReceivedLog
          MetricValue: "1"

  PhysicalControlReportedStateMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref PhysicalControlReportedStateLogGroup
      FilterPattern: '{ $.PhysicalReportedStateReceived = 1 }'
      MetricTransformations:
        - MetricNamespace: MySnoozePod/IoT
          MetricName: PhysicalReportedStateReceivedLog
          MetricValue: "1"

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-zone-event-lambda-errors"
      AlarmDescription: Zone event ingestion Lambda had runtime errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ZoneEventIngestFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

  ZoneEventRejectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-zone-event-rejected"
      AlarmDescription: Zone event rejects or malformed payloads spiked.
      Namespace: MySnoozePod/IoT
      MetricName: ZoneEventRejectedLog
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

  QuarantineVisibleMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-iot-quarantine-visible"
      AlarmDescription: IoT quarantine queue has visible messages.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IoTQuarantineQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

  ZoneStateWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-zone-state-write-throttles"
      AlarmDescription: Zone state table write throttling detected.
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref ZoneStateTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

  ZoneEventsWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-zone-events-write-throttles"
      AlarmDescription: Zone events table write throttling detected.
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref ZoneEventsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

  PhysicalControlLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-physical-control-lambda-errors"
      AlarmDescription: Physical control ack/reported-state/timeout Lambda had runtime errors.
      Metrics:
        - Id: ackErrors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref PhysicalControlAckFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: reportedErrors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref PhysicalControlReportedStateFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: timeoutErrors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref PhysicalControlTimeoutFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: totalErrors
          Expression: "ackErrors + reportedErrors + timeoutErrors"
          Label: PhysicalControlLambdaErrors
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

  PhysicalControlWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-physical-control-write-throttles"
      AlarmDescription: Physical control table write throttling detected.
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref PhysicalControlTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

Outputs:
  ZoneEventIngestFunctionName:
    Description: Lambda function for AWS IoT Rule target.
    Value: !Ref ZoneEventIngestFunction
  ZoneEventIngestFunctionArn:
    Description: Lambda function ARN for AWS IoT Rule target.
    Value: !GetAtt ZoneEventIngestFunction.Arn
  ZoneEventIngestRuleName:
    Description: AWS IoT Rule name.
    Value: !Ref ZoneEventIngestRule
  ZoneStateTableName:
    Description: DynamoDB latest zone state table.
    Value: !Ref ZoneStateTable
  ZoneEventsTableName:
    Description: DynamoDB append-only zone events table.
    Value: !Ref ZoneEventsTable
  WebSocketConnectionsTableName:
    Description: DynamoDB WebSocket connection and zone subscription table.
    Value: !Ref WebSocketConnectionsTable
  PhysicalControlTableName:
    Description: DynamoDB physical control command status and reported-state table.
    Value: !Ref PhysicalControlTable
  PhysicalControlCommandFunctionName:
    Description: Lambda function for physical control command issue/publish.
    Value: !Ref PhysicalControlCommandFunction
  PhysicalControlAckFunctionName:
    Description: Lambda function for physical control ack ingestion.
    Value: !Ref PhysicalControlAckFunction
  PhysicalControlReportedStateFunctionName:
    Description: Lambda function for physical reported-state ingestion.
    Value: !Ref PhysicalControlReportedStateFunction
  PhysicalControlAckRuleName:
    Description: AWS IoT Rule name for physical control acknowledgements.
    Value: !Ref PhysicalControlAckRule
  PhysicalControlReportedStateRuleName:
    Description: AWS IoT Rule name for physical reported-state updates.
    Value: !Ref PhysicalControlReportedStateRule
  ShowroomWebSocketApiId:
    Description: API Gateway WebSocket API ID.
    Value: !Ref ShowroomWebSocketApi
  ShowroomWebSocketUrl:
    Description: WebSocket endpoint for realtime showroom zone events.
    Value: !Sub "wss://${ShowroomWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${DeploymentEnv}"
  IotWebSocketFunctionName:
    Description: WebSocket connect/disconnect/subscribe/unsubscribe Lambda.
    Value: !Ref IotWebSocketFunction
  IotWebSocketCleanupFunctionName:
    Description: Scheduled stale WebSocket connection cleanup Lambda.
    Value: !Ref IotWebSocketCleanupFunction
  IoTQuarantineQueueUrl:
    Description: SQS queue URL for malformed IoT events and IoT Rule errors.
    Value: !Ref IoTQuarantineQueue
  IoTAlarmTopicArn:
    Description: SNS topic ARN for IoT CloudWatch alarms.
    Value: !Ref IoTAlarmTopic
