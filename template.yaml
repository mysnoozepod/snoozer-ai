AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MySnoozePod IoT backend stack for zone event ingestion, persistence, quarantine, and observability.

Parameters:
  DeploymentEnv:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment isolated across IoT, Lambda, DynamoDB, SQS, and CloudWatch.
  StoreId:
    Type: String
    Default: severn-pilot
    Description: MySnoozePod showroom store identifier.
  EventTtlDays:
    Type: Number
    Default: 180
    MinValue: 1
    Description: TTL in days for append-only zone event history and idempotency records.
  LogLevel:
    Type: String
    Default: info
    AllowedValues:
      - debug
      - info
      - warn
      - error
    Description: Runtime log level for IoT ingestion.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
    Description: CloudWatch log retention for the ingestion Lambda.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email endpoint for IoT alarm notifications. Leave blank to create alarms without email actions.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Timeout: 15
    MemorySize: 256

Resources:
  ZoneStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "msp-${DeploymentEnv}-zone-state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  ZoneEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "msp-${DeploymentEnv}-zone-events"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  WebSocketConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "msp-${DeploymentEnv}-websocket-connections"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  IoTQuarantineQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "msp-${DeploymentEnv}-iot-quarantine"
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  IoTAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "msp-${DeploymentEnv}-iot-alarms"
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  IoTAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref IoTAlarmTopic

  ZoneEventIngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/msp-${DeploymentEnv}-zone-event-ingest"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  ZoneEventIngestFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - ZoneEventIngestLogGroup
    Properties:
      FunctionName: !Sub "msp-${DeploymentEnv}-zone-event-ingest"
      Description: MySnoozePod IoT ZoneEvent ingestion handler.
      CodeUri: .
      Handler: index.iotZoneEventHandler
      Environment:
        Variables:
          IOT_ENV: !Ref DeploymentEnv
          IOT_STORE_ID: !Ref StoreId
          IOT_DEVICE_REGISTRY_PATH: data/iot-device-registry.v1.json
          IOT_ZONE_STATE_TABLE: !Ref ZoneStateTable
          IOT_ZONE_EVENTS_TABLE: !Ref ZoneEventsTable
          IOT_QUARANTINE_QUEUE_URL: !Ref IoTQuarantineQueue
          IOT_EVENT_TTL_DAYS: !Ref EventTtlDays
          IOT_LOG_LEVEL: !Ref LogLevel
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: "2012-10-17"
          Statement:
            - Sid: ZoneStateReadWrite
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt ZoneStateTable.Arn
            - Sid: ZoneEventAppendAndIdempotency
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:TransactWriteItems
                - dynamodb:Query
              Resource:
                - !GetAtt ZoneEventsTable.Arn
                - !Sub "${ZoneEventsTable.Arn}/index/*"
            - Sid: QuarantineMalformedEvents
              Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt IoTQuarantineQueue.Arn
      Tags:
        App: MySnoozePod
        Environment: !Ref DeploymentEnv
        StackArea: IoT

  ZoneEventIngestRule:
    Type: AWS::IoT::TopicRule
    DependsOn:
      - ZoneEventIngestInvokePermission
    Properties:
      RuleName: !Sub "msp_${DeploymentEnv}_zone_event_ingest_rule"
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Sql: "SELECT *, topic() AS mqttTopic, timestamp() AS iotReceivedAt FROM 'mysnoozepod/+/stores/+/+/+/#'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt ZoneEventIngestFunction.Arn
        ErrorAction:
          Sqs:
            QueueUrl: !Ref IoTQuarantineQueue
            RoleArn: !GetAtt IoTRuleErrorActionRole.Arn
            UseBase64: false

  IoTRuleErrorActionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "msp-${DeploymentEnv}-iot-rule-error-action-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendIoTRuleFailuresToQuarantine
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt IoTQuarantineQueue.Arn
      Tags:
        - Key: App
          Value: MySnoozePod
        - Key: Environment
          Value: !Ref DeploymentEnv
        - Key: StackArea
          Value: IoT

  ZoneEventIngestInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ZoneEventIngestFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:rule/msp_${DeploymentEnv}_zone_event_ingest_rule"

  ZoneEventAcceptedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ZoneEventIngestLogGroup
      FilterPattern: '{ $.event = "iot.zone_event.accepted" }'
      MetricTransformations:
        - MetricNamespace: MySnoozePod/IoT
          MetricName: ZoneEventAcceptedLog
          MetricValue: "1"

  ZoneEventRejectedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ZoneEventIngestLogGroup
      FilterPattern: '{ $.event = "iot.zone_event.rejected" }'
      MetricTransformations:
        - MetricNamespace: MySnoozePod/IoT
          MetricName: ZoneEventRejectedLog
          MetricValue: "1"

  ZoneEventDuplicateMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ZoneEventIngestLogGroup
      FilterPattern: '{ $.event = "iot.zone_event.duplicate_suppressed" }'
      MetricTransformations:
        - MetricNamespace: MySnoozePod/IoT
          MetricName: ZoneEventDuplicateSuppressedLog
          MetricValue: "1"

  QuarantineFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ZoneEventIngestLogGroup
      FilterPattern: '{ $.event = "iot.zone_event.quarantine_failed" }'
      MetricTransformations:
        - MetricNamespace: MySnoozePod/IoT
          MetricName: ZoneEventQuarantineFailedLog
          MetricValue: "1"

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-zone-event-lambda-errors"
      AlarmDescription: Zone event ingestion Lambda had runtime errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ZoneEventIngestFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

  ZoneEventRejectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-zone-event-rejected"
      AlarmDescription: Zone event rejects or malformed payloads spiked.
      Namespace: MySnoozePod/IoT
      MetricName: ZoneEventRejectedLog
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

  QuarantineVisibleMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-iot-quarantine-visible"
      AlarmDescription: IoT quarantine queue has visible messages.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt IoTQuarantineQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

  ZoneStateWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-zone-state-write-throttles"
      AlarmDescription: Zone state table write throttling detected.
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref ZoneStateTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

  ZoneEventsWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "msp-${DeploymentEnv}-zone-events-write-throttles"
      AlarmDescription: Zone events table write throttling detected.
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref ZoneEventsTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref IoTAlarmTopic], []]

Outputs:
  ZoneEventIngestFunctionName:
    Description: Lambda function for AWS IoT Rule target.
    Value: !Ref ZoneEventIngestFunction
  ZoneEventIngestFunctionArn:
    Description: Lambda function ARN for AWS IoT Rule target.
    Value: !GetAtt ZoneEventIngestFunction.Arn
  ZoneEventIngestRuleName:
    Description: AWS IoT Rule name.
    Value: !Ref ZoneEventIngestRule
  ZoneStateTableName:
    Description: DynamoDB latest zone state table.
    Value: !Ref ZoneStateTable
  ZoneEventsTableName:
    Description: DynamoDB append-only zone events table.
    Value: !Ref ZoneEventsTable
  WebSocketConnectionsTableName:
    Description: DynamoDB WebSocket connection table reserved for later websocket push.
    Value: !Ref WebSocketConnectionsTable
  IoTQuarantineQueueUrl:
    Description: SQS queue URL for malformed IoT events and IoT Rule errors.
    Value: !Ref IoTQuarantineQueue
  IoTAlarmTopicArn:
    Description: SNS topic ARN for IoT CloudWatch alarms.
    Value: !Ref IoTAlarmTopic
